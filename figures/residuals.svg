<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow4-res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/>
    </marker>
  </defs>
  <style>
    .block { fill: #eef2ff; stroke: #3730a3; stroke-width: 1.5; }
    .addnorm { fill: #fef9c3; stroke: #92400e; stroke-width: 1.2; }
    .io { fill: #f3f4f6; stroke: #374151; stroke-width: 1.2; }
    .lbl { font-size: 13px; fill: #111827; text-anchor: middle; }
    .lbl-sm { font-size: 11px; fill: #111827; text-anchor: middle; }
    .cap { font-size: 12px; fill: #374151; text-anchor: middle; }
    .arr { stroke: #1f2937; stroke-width: 1.6; fill: none; marker-end: url(#arrow4); }
    .res-arr { stroke: #166534; stroke-width: 1.8; fill: none; marker-end: url(#arrow4-res); }
    .sum { fill: #ffffff; stroke: #166534; stroke-width: 1.6; }
  </style>

  <text x="310" y="24" class="lbl" font-size="16" font-weight="600">One Decoder Block, With Residual Connections</text>

  <!-- Input -->
  <rect x="205" y="555" width="210" height="34" rx="4" class="io"/>
  <text x="310" y="576" class="lbl-sm">Input (from previous layer)</text>

  <!-- up to self-attention -->
  <line x1="310" y1="555" x2="310" y2="518" class="arr"/>
  <rect x="205" y="468" width="210" height="50" rx="4" class="block"/>
  <text x="310" y="497" class="lbl-sm">Self-Attention</text>

  <!-- up to sum 1 -->
  <line x1="310" y1="468" x2="310" y2="440" class="arr"/>
  <circle cx="310" cy="424" r="16" class="sum"/>
  <text x="310" y="429" class="lbl-sm" fill="#166534" font-weight="600">+</text>

  <!-- residual 1: from just above input, around the right, into sum 1 -->
  <path d="M 415 555 C 500 555, 500 424, 326 424" class="res-arr"/>

  <!-- up to norm 1 -->
  <line x1="310" y1="408" x2="310" y2="382" class="arr"/>
  <rect x="230" y="360" width="160" height="22" rx="3" class="addnorm"/>
  <text x="310" y="375" class="lbl-sm">Norm</text>

  <!-- up to feed-forward -->
  <line x1="310" y1="360" x2="310" y2="334" class="arr"/>
  <rect x="205" y="284" width="210" height="50" rx="4" class="block"/>
  <text x="310" y="313" class="lbl-sm">Feed-Forward</text>

  <!-- up to sum 2 -->
  <line x1="310" y1="284" x2="310" y2="256" class="arr"/>
  <circle cx="310" cy="240" r="16" class="sum"/>
  <text x="310" y="245" class="lbl-sm" fill="#166534" font-weight="600">+</text>

  <!-- residual 2: from just above norm 1, around the right, into sum 2 -->
  <path d="M 390 371 C 470 371, 470 240, 326 240" class="res-arr"/>

  <!-- up to output — no norm here; only one norm per block, after self-attention -->
  <line x1="310" y1="224" x2="310" y2="150" class="arr"/>
  <rect x="205" y="108" width="210" height="34" rx="4" class="io"/>
  <text x="310" y="126" class="lbl-sm">Output (to next layer, or the</text>
  <text x="310" y="138" class="lbl-sm">final norm if this is the last one)</text>

  <text x="310" y="80" class="lbl-sm" fill="#166534" font-weight="600">green arrows = residual (skip) connections</text>

  <text x="310" y="607" class="cap">Each block's input rejoins the flow after Self-Attention and after</text>
  <text x="310" y="620" class="cap">Feed-Forward. Only one norm per block — the block exits right after the add.</text>
</svg>
