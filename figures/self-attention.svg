<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow3-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <style>
    .tok { fill: #eef2ff; stroke: #3730a3; stroke-width: 1.3; }
    .tok-q { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .lbl { font-size: 13px; fill: #111827; text-anchor: middle; }
    .lbl-sm { font-size: 11px; fill: #111827; text-anchor: middle; }
    .lbl-tiny { font-size: 10px; fill: #4b5563; text-anchor: middle; }
    .cap { font-size: 12px; fill: #374151; text-anchor: middle; }
    .k-arr { stroke: #6b7280; stroke-width: 1; fill: none; marker-end: url(#arrow3); opacity: 0.55; }
    .k-arr-hi { stroke: #b91c1c; stroke-width: 2.4; fill: none; marker-end: url(#arrow3-hi); }
    .out { fill: #dcfce7; stroke: #166534; stroke-width: 1.5; }
  </style>

  <text x="410" y="24" class="lbl" font-size="16" font-weight="600">Self-attention: one query token reading every key</text>

  <!-- token row -->
  <!-- positions for: The cat sat on the mat because it was tired -->
  <!-- x centers spaced across width -->
  <g>
    <rect x="40"  y="70" width="60" height="30" rx="4" class="tok"/><text x="70"  y="90" class="lbl-sm">The</text>
    <rect x="112" y="70" width="60" height="30" rx="4" class="tok"/><text x="142" y="90" class="lbl-sm">cat</text>
    <rect x="184" y="70" width="60" height="30" rx="4" class="tok"/><text x="214" y="90" class="lbl-sm">sat</text>
    <rect x="256" y="70" width="60" height="30" rx="4" class="tok"/><text x="286" y="90" class="lbl-sm">on</text>
    <rect x="328" y="70" width="60" height="30" rx="4" class="tok"/><text x="358" y="90" class="lbl-sm">the</text>
    <rect x="400" y="70" width="60" height="30" rx="4" class="tok"/><text x="430" y="90" class="lbl-sm">mat</text>
    <rect x="472" y="70" width="76" height="30" rx="4" class="tok"/><text x="510" y="90" class="lbl-sm">because</text>
    <rect x="576" y="70" width="60" height="30" rx="4" class="tok-q"/><text x="606" y="90" class="lbl-sm" font-weight="600">it</text>
    <rect x="648" y="70" width="60" height="30" rx="4" class="tok"/><text x="678" y="90" class="lbl-sm">was</text>
    <rect x="720" y="70" width="70" height="30" rx="4" class="tok"/><text x="755" y="90" class="lbl-sm">tired</text>
  </g>
  <text x="410" y="52" class="lbl-tiny">query token = &#8220;it&#8221; (highlighted); every other token offers a key + value</text>

  <!-- key arrows from every token down to a comparison point below "it" -->
  <!-- comparison node -->
  <circle cx="606" cy="200" r="20" fill="#ffffff" stroke="#111827" stroke-width="1.4"/>
  <text x="606" y="196" class="lbl-tiny">Q</text>
  <text x="606" y="208" class="lbl-tiny">&#183; K</text>

  <line x1="70"  y1="100" x2="590" y2="185" class="k-arr"/>
  <line x1="142" y1="100" x2="595" y2="184" class="k-arr-hi"/>
  <line x1="214" y1="100" x2="598" y2="183" class="k-arr"/>
  <line x1="286" y1="100" x2="600" y2="182" class="k-arr"/>
  <line x1="358" y1="100" x2="602" y2="181" class="k-arr"/>
  <line x1="430" y1="100" x2="604" y2="181" class="k-arr"/>
  <line x1="510" y1="100" x2="605" y2="181" class="k-arr"/>
  <line x1="606" y1="100" x2="606" y2="180" class="k-arr"/>
  <line x1="678" y1="100" x2="609" y2="181" class="k-arr"/>
  <line x1="755" y1="100" x2="614" y2="182" class="k-arr"/>

  <text x="142" y="140" class="lbl-tiny" fill="#b91c1c" font-weight="600">highest weight</text>

  <!-- weighted sum -> new representation for "it" -->
  <line x1="606" y1="220" x2="606" y2="270" class="k-arr-hi"/>
  <rect x="516" y="270" width="180" height="46" rx="6" class="out"/>
  <text x="606" y="290" class="lbl-sm" font-weight="600">new representation of &#8220;it&#8221;</text>
  <text x="606" y="305" class="lbl-tiny">(mostly a weighted mix of &#8220;cat&#8221;&#8217;s value)</text>

  <!-- weight bar chart along the bottom showing relative attention weight -->
  <text x="410" y="356" class="lbl" font-weight="600">Attention weight from &#8220;it&#8221; to each token (illustrative)</text>
  <g font-size="10">
    <rect x="55"  y="395" width="30" height="6"  fill="#c7d2fe"/>
    <rect x="127" y="368" width="30" height="33" fill="#b91c1c"/>
    <rect x="199" y="398" width="30" height="3"  fill="#c7d2fe"/>
    <rect x="271" y="398" width="30" height="3"  fill="#c7d2fe"/>
    <rect x="343" y="396" width="30" height="5"  fill="#c7d2fe"/>
    <rect x="415" y="392" width="30" height="9"  fill="#c7d2fe"/>
    <rect x="487" y="394" width="30" height="7"  fill="#c7d2fe"/>
    <rect x="591" y="390" width="30" height="11" fill="#c7d2fe"/>
    <rect x="663" y="397" width="30" height="4"  fill="#c7d2fe"/>
    <rect x="735" y="399" width="30" height="2"  fill="#c7d2fe"/>
  </g>
  <line x1="40" y1="401" x2="805" y2="401" stroke="#111827" stroke-width="1"/>
  <text x="70"  y="415" class="lbl-tiny">The</text>
  <text x="142" y="415" class="lbl-tiny" fill="#b91c1c" font-weight="600">cat</text>
  <text x="214" y="415" class="lbl-tiny">sat</text>
  <text x="286" y="415" class="lbl-tiny">on</text>
  <text x="358" y="415" class="lbl-tiny">the</text>
  <text x="430" y="415" class="lbl-tiny">mat</text>
  <text x="510" y="415" class="lbl-tiny">because</text>
  <text x="606" y="415" class="lbl-tiny">it</text>
  <text x="678" y="415" class="lbl-tiny">was</text>
  <text x="755" y="415" class="lbl-tiny">tired</text>

  <text x="410" y="440" class="cap">Query/key/value weighting lets &#8220;it&#8221; pull its representation mostly from &#8220;cat&#8221; &#8212; see the real weights from GPT-2 small in the demo below.</text>
</svg>
