<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 838" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/>
    </marker>
  </defs>

  <style>
    .block { fill: #eef2ff; stroke: #3730a3; stroke-width: 1.5; }
    .addnorm { fill: #fef9c3; stroke: #92400e; stroke-width: 1.2; }
    .io { fill: #f3f4f6; stroke: #374151; stroke-width: 1.2; }
    .stacklabel { fill: #ffffff; stroke: #111827; stroke-width: 1.5; }
    .sum { fill: #ffffff; stroke: #166534; stroke-width: 1.4; }
    .lbl { font-size: 13px; fill: #111827; text-anchor: middle; }
    .lbl-sm { font-size: 11px; fill: #111827; text-anchor: middle; }
    .cap { font-size: 12px; fill: #374151; text-anchor: middle; }
    .arr { stroke: #1f2937; stroke-width: 1.6; fill: none; marker-end: url(#arrow2); }
    .res-arr { stroke: #166534; stroke-width: 1.8; fill: none; marker-end: url(#arrow2r); }
  </style>

  <text x="200" y="28" class="lbl" font-size="16" font-weight="600">Decoder-Only Stack</text>

  <!-- input pipeline: words -> tokens -> embeddings -> embeddings + position -->
  <rect x="90" y="738" width="220" height="34" rx="4" class="io"/>
  <text x="200" y="759" class="lbl-sm">Words (raw text)</text>

  <line x1="200" y1="738" x2="200" y2="714" class="arr"/>
  <rect x="90" y="680" width="220" height="34" rx="4" class="io"/>
  <text x="200" y="701" class="lbl-sm">Tokens (tokenizer output)</text>

  <line x1="200" y1="680" x2="200" y2="656" class="arr"/>
  <rect x="90" y="622" width="220" height="34" rx="4" class="io"/>
  <text x="200" y="643" class="lbl-sm">Embeddings</text>

  <line x1="200" y1="622" x2="200" y2="598" class="arr"/>
  <rect x="90" y="564" width="220" height="34" rx="4" class="io"/>
  <text x="200" y="585" class="lbl-sm">Embeddings + Position</text>

  <!-- self-attention, with residual -->
  <line x1="200" y1="564" x2="200" y2="534" class="arr"/>
  <rect x="90" y="484" width="220" height="50" rx="4" class="block"/>
  <text x="200" y="505" class="lbl-sm">Masked Self-Attention</text>
  <text x="200" y="521" class="lbl-sm">(multiple heads, in parallel)</text>

  <line x1="200" y1="484" x2="200" y2="466" class="arr"/>
  <circle cx="200" cy="450" r="15" class="sum"/>
  <text x="200" y="455" class="lbl-sm" fill="#166534" font-weight="600">+</text>
  <path d="M 310 564 C 360 564, 360 450, 218 450" class="res-arr"/>

  <line x1="200" y1="434" x2="200" y2="410" class="arr"/>
  <rect x="120" y="388" width="160" height="22" rx="3" class="addnorm"/>
  <text x="200" y="403" class="lbl-sm">Norm</text>

  <!-- feed-forward, with residual -->
  <line x1="200" y1="388" x2="200" y2="362" class="arr"/>
  <rect x="90" y="318" width="220" height="44" rx="4" class="block"/>
  <text x="200" y="344" class="lbl-sm">Feed-Forward</text>

  <line x1="200" y1="318" x2="200" y2="300" class="arr"/>
  <circle cx="200" cy="284" r="15" class="sum"/>
  <text x="200" y="289" class="lbl-sm" fill="#166534" font-weight="600">+</text>
  <path d="M 280 388 C 355 388, 355 284, 218 284" class="res-arr"/>

  <!-- ×N bracket around the repeated block — note: no norm here, the block
       exits right after the residual add. Only one norm per repeat (after
       self-attention); the final norm below is outside the loop. -->
  <rect x="66" y="216" width="290" height="374" rx="10" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="66" cy="216" r="15" class="stacklabel"/>
  <text x="66" y="221" class="lbl-sm" font-weight="600">&#215;N</text>

  <line x1="200" y1="268" x2="200" y2="192" class="arr"/>
  <rect x="90" y="158" width="220" height="30" rx="4" class="io"/>
  <text x="200" y="178" class="lbl-sm">Final Layer Norm</text>

  <line x1="200" y1="158" x2="200" y2="136" class="arr"/>
  <rect x="90" y="104" width="220" height="30" rx="4" class="io"/>
  <text x="200" y="124" class="lbl-sm">Linear + Softmax</text>

  <line x1="200" y1="104" x2="200" y2="82" class="arr"/>
  <text x="200" y="70" class="lbl-sm" font-weight="600">Next-token probabilities</text>

  <text x="200" y="790" class="cap">Words &#8594; tokens &#8594; embeddings &#8594; embeddings + position,</text>
  <text x="200" y="804" class="cap">then the block above repeats &#215;N times. Green arrows</text>
  <text x="200" y="818" class="cap">are the residual (skip) connections.</text>
</svg>
