<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <style>
    .llm { fill: #eef2ff; stroke: #3730a3; stroke-width: 2; }
    .io { fill: #f3f4f6; stroke: #374151; stroke-width: 1.2; }
    .lbl-t { font-size: 14px; fill: #111827; text-anchor: middle; }
    .lbl { font-size: 12px; fill: #111827; text-anchor: middle; }
    .lbl-arrow { font-size: 10.5px; fill: #374151; text-anchor: middle; }
    .cap { font-size: 11px; fill: #374151; text-anchor: middle; }
    .arr { stroke: #1f2937; stroke-width: 1.6; fill: none; marker-end: url(#arrowal); }
  </style>

  <text x="320" y="18" class="lbl-t" font-weight="600">Agentic System = LLM + Action-Taking</text>

  <!-- LLM box (the orchestrator) -->
  <rect x="250" y="40" width="140" height="50" rx="6" class="llm"/>
  <text x="320" y="61" class="lbl" font-weight="600">LLM</text>
  <text x="320" y="76" class="lbl">(orchestrates)</text>

  <!-- Action box -->
  <rect x="440" y="190" width="150" height="50" rx="4" class="io"/>
  <text x="515" y="211" class="lbl">Action</text>
  <text x="515" y="226" class="lbl">(tool call, message...)</text>

  <!-- Environment box -->
  <rect x="50" y="190" width="170" height="50" rx="4" class="io"/>
  <text x="135" y="211" class="lbl">Environment</text>
  <text x="135" y="226" class="lbl">(tools, world, data)</text>

  <!-- LLM -> Action -->
  <path d="M 385 88 C 460 120, 500 150, 515 188" class="arr"/>
  <text x="470" y="130" class="lbl-arrow">decides</text>

  <!-- Action -> Environment -->
  <line x1="440" y1="215" x2="222" y2="215" class="arr"/>
  <text x="330" y="255" class="lbl-arrow">acts in the world</text>

  <!-- Environment -> LLM -->
  <path d="M 150 188 C 165 150, 210 110, 255 87" class="arr"/>
  <text x="165" y="130" class="lbl-arrow">observes result</text>

  <text x="320" y="270" class="cap">The LLM is the piece that decides — everything else in this loop is built around it.</text>
</svg>
