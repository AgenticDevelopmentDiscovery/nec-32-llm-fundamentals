<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 905 180" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowh1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <style>
    .block { fill: #eef2ff; stroke: #3730a3; stroke-width: 1.3; }
    .addnorm { fill: #fef9c3; stroke: #92400e; stroke-width: 1.1; }
    .io { fill: #f3f4f6; stroke: #374151; stroke-width: 1.1; }
    .lbl-t { font-size: 12px; fill: #111827; text-anchor: middle; }
    .lbl-sm { font-size: 9.5px; fill: #111827; text-anchor: middle; }
    .cap { font-size: 11px; fill: #374151; text-anchor: middle; }
    .arr { stroke: #1f2937; stroke-width: 1.4; fill: none; marker-end: url(#arrowh1); }
    .hl { fill: none; stroke: #dc2626; stroke-width: 3.2; }
  </style>

  <text x="452" y="16" class="lbl-t" font-weight="600">Where we are in the decoder stack</text>

  <!-- ×N bracket -->
  <rect x="122" y="30" width="443" height="70" rx="10" fill="none" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="4 3"/>
  <circle cx="122" cy="30" r="11" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="122" y="34" class="lbl-sm" font-weight="600">&#215;N</text>

  <!-- boxes -->
  <rect x="20" y="40" width="95" height="50" rx="4" class="io"/>
  <text x="67" y="69" class="lbl-sm">Input</text>

  <rect x="130" y="40" width="95" height="50" rx="4" class="block"/>
  <text x="177" y="63" class="lbl-sm">Self-</text>
  <text x="177" y="75" class="lbl-sm">Attn</text>

  <rect x="240" y="40" width="95" height="50" rx="4" class="addnorm"/>
  <text x="287" y="63" class="lbl-sm">Add &amp;</text>
  <text x="287" y="75" class="lbl-sm">Norm</text>

  <rect x="350" y="40" width="95" height="50" rx="4" class="block"/>
  <text x="397" y="63" class="lbl-sm">Feed-</text>
  <text x="397" y="75" class="lbl-sm">Forward</text>

  <rect x="460" y="40" width="95" height="50" rx="4" class="addnorm"/>
  <text x="507" y="63" class="lbl-sm">Add &amp;</text>
  <text x="507" y="75" class="lbl-sm">Norm</text>

  <rect x="570" y="40" width="95" height="50" rx="4" class="io"/>
  <text x="617" y="63" class="lbl-sm">Final</text>
  <text x="617" y="75" class="lbl-sm">Norm</text>

  <rect x="680" y="40" width="95" height="50" rx="4" class="io"/>
  <text x="727" y="63" class="lbl-sm">Linear +</text>
  <text x="727" y="75" class="lbl-sm">Softmax</text>

  <rect x="790" y="40" width="95" height="50" rx="4" class="io"/>
  <text x="837" y="63" class="lbl-sm">Next-token</text>
  <text x="837" y="75" class="lbl-sm">probs</text>

  <!-- arrows -->
  <line x1="115" y1="65" x2="128" y2="65" class="arr"/>
  <line x1="225" y1="65" x2="238" y2="65" class="arr"/>
  <line x1="335" y1="65" x2="348" y2="65" class="arr"/>
  <line x1="445" y1="65" x2="458" y2="65" class="arr"/>
  <line x1="555" y1="65" x2="568" y2="65" class="arr"/>
  <line x1="665" y1="65" x2="678" y2="65" class="arr"/>
  <line x1="775" y1="65" x2="788" y2="65" class="arr"/>

  <!-- highlight: input -->
  <ellipse cx="67" cy="65" rx="60" ry="38" class="hl"/>

  <text x="452" y="150" class="cap">Highlighted: token + positional embedding —</text>
  <text x="452" y="165" class="cap">the input to every layer.</text>
</svg>
