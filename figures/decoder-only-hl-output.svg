<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 200" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="ah-res5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/>
    </marker>
  </defs>
  <style>
    .block { fill: #eef2ff; stroke: #3730a3; stroke-width: 1.3; }
    .addnorm { fill: #fef9c3; stroke: #92400e; stroke-width: 1.1; }
    .io { fill: #f3f4f6; stroke: #374151; stroke-width: 1.1; }
    .lbl-t { font-size: 12px; fill: #111827; text-anchor: middle; }
    .lbl-sm { font-size: 8.5px; fill: #111827; text-anchor: middle; }
    .cap { font-size: 11px; fill: #374151; text-anchor: middle; }
    .arr { stroke: #1f2937; stroke-width: 1.3; fill: none; marker-end: url(#ah-arrow5); }
    .res-arr { stroke: #166534; stroke-width: 1.5; fill: none; marker-end: url(#ah-res5); }
    .sum { fill: #ffffff; stroke: #166534; stroke-width: 1.3; }
    .hl { fill: none; stroke: #dc2626; stroke-width: 3.2; }
  </style>

  <text x="445" y="12" class="lbl-t" font-weight="600">Where we are in the decoder stack</text>

  <rect x="20" y="70" width="70" height="50" rx="4" class="io"/>
  <text x="55" y="99" class="lbl-sm">Words</text>

  <rect x="104" y="70" width="70" height="50" rx="4" class="io"/>
  <text x="139" y="99" class="lbl-sm">Tokens</text>

  <rect x="188" y="70" width="70" height="50" rx="4" class="io"/>
  <text x="223" y="93" class="lbl-sm">Tok +</text>
  <text x="223" y="103" class="lbl-sm">Pos</text>

  <rect x="272" y="70" width="70" height="50" rx="4" class="block"/>
  <text x="307" y="93" class="lbl-sm">Self-</text>
  <text x="307" y="103" class="lbl-sm">Attn</text>

  <rect x="356" y="70" width="70" height="50" rx="4" class="addnorm"/>
  <text x="391" y="93" class="lbl-sm">Add &amp;</text>
  <text x="391" y="103" class="lbl-sm">Norm</text>

  <rect x="440" y="70" width="70" height="50" rx="4" class="block"/>
  <text x="475" y="93" class="lbl-sm">Feed-</text>
  <text x="475" y="103" class="lbl-sm">Fwd</text>

  <rect x="524" y="70" width="70" height="50" rx="4" class="addnorm"/>
  <text x="559" y="99" class="lbl-sm">Add</text>

  <rect x="608" y="70" width="70" height="50" rx="4" class="io"/>
  <text x="643" y="93" class="lbl-sm">Final</text>
  <text x="643" y="103" class="lbl-sm">Norm</text>

  <rect x="692" y="70" width="70" height="50" rx="4" class="io"/>
  <text x="727" y="93" class="lbl-sm">Linear+</text>
  <text x="727" y="103" class="lbl-sm">Softmax</text>

  <rect x="776" y="70" width="70" height="50" rx="4" class="io"/>
  <text x="811" y="93" class="lbl-sm">Next-</text>
  <text x="811" y="103" class="lbl-sm">token</text>

  <line x1="90" y1="95" x2="102" y2="95" class="arr"/>
  <line x1="174" y1="95" x2="186" y2="95" class="arr"/>
  <line x1="258" y1="95" x2="270" y2="95" class="arr"/>

  <path d="M 272 82 C 300 30, 325 30, 349 88" class="res-arr"/>
  <line x1="342" y1="95" x2="347" y2="95" class="arr"/>
  <circle cx="349" cy="95" r="8" class="sum"/>
  <text x="349" y="98" class="lbl-sm" fill="#166534" font-weight="600">+</text>
  <line x1="357" y1="95" x2="354" y2="95" class="arr"/>

  <path d="M 440 82 C 468 30, 493 30, 517 88" class="res-arr"/>
  <line x1="510" y1="95" x2="515" y2="95" class="arr"/>
  <circle cx="517" cy="95" r="8" class="sum"/>
  <text x="517" y="98" class="lbl-sm" fill="#166534" font-weight="600">+</text>
  <line x1="525" y1="95" x2="522" y2="95" class="arr"/>

  <line x1="594" y1="95" x2="606" y2="95" class="arr"/>
  <line x1="678" y1="95" x2="690" y2="95" class="arr"/>
  <line x1="762" y1="95" x2="774" y2="95" class="arr"/>

  <rect x="266" y="128" width="334" height="18" rx="8" fill="none" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="4 3"/>
  <circle cx="266" cy="137" r="10" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="266" y="140" class="lbl-sm" font-weight="600">&#215;N</text>

  <!-- highlight: final norm, linear+softmax, next-token -->
  <ellipse cx="727" cy="95" rx="128" ry="38" class="hl"/>

  <text x="445" y="175" class="cap">Highlighted: one norm after the ×N block, then a</text>
  <text x="445" y="188" class="cap">projection to a distribution over the vocabulary.</text>
</svg>
