<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 200" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="ah-res2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/>
    </marker>
  </defs>
  <style>
    .block { fill: #eef2ff; stroke: #3730a3; stroke-width: 1.3; }
    .addnorm { fill: #fef9c3; stroke: #92400e; stroke-width: 1.1; }
    .io { fill: #f3f4f6; stroke: #374151; stroke-width: 1.1; }
    .lbl-t { font-size: 12px; fill: #111827; text-anchor: middle; }
    .lbl-sm { font-size: 8.5px; fill: #111827; text-anchor: middle; }
    .cap { font-size: 11px; fill: #374151; text-anchor: middle; }
    .arr { stroke: #1f2937; stroke-width: 1.3; fill: none; marker-end: url(#ah-arrow2); }
    .res-arr { stroke: #166534; stroke-width: 1.5; fill: none; marker-end: url(#ah-res2); }
    .sum { fill: #ffffff; stroke: #166534; stroke-width: 1.3; }
    .hl { fill: none; stroke: #dc2626; stroke-width: 3.2; }
  </style>

  <text x="455" y="12" class="lbl-t" font-weight="600">Where we are in the decoder stack</text>

  <rect x="20" y="70" width="70" height="50" rx="4" class="io"/>
  <text x="55" y="99" class="lbl-sm">Words</text>

  <rect x="104" y="70" width="70" height="50" rx="4" class="io"/>
  <text x="139" y="99" class="lbl-sm">Tokens</text>

  <rect x="188" y="70" width="70" height="50" rx="4" class="io"/>
  <text x="223" y="99" class="lbl-sm">Embeddings</text>

  <rect x="272" y="70" width="70" height="50" rx="4" class="io"/>
  <text x="307" y="93" class="lbl-sm">Emb +</text>
  <text x="307" y="103" class="lbl-sm">Pos</text>

  <rect x="356" y="70" width="70" height="50" rx="4" class="block"/>
  <text x="391" y="93" class="lbl-sm">Self-</text>
  <text x="391" y="103" class="lbl-sm">Attn</text>

  <rect x="440" y="70" width="70" height="50" rx="4" class="addnorm"/>
  <text x="475" y="99" class="lbl-sm">Norm</text>

  <rect x="524" y="70" width="70" height="50" rx="4" class="block"/>
  <text x="559" y="93" class="lbl-sm">Feed-</text>
  <text x="559" y="103" class="lbl-sm">Fwd</text>

  <rect x="630" y="70" width="70" height="50" rx="4" class="io"/>
  <text x="665" y="93" class="lbl-sm">Final</text>
  <text x="665" y="103" class="lbl-sm">Norm</text>

  <rect x="714" y="70" width="70" height="50" rx="4" class="io"/>
  <text x="749" y="93" class="lbl-sm">Linear+</text>
  <text x="749" y="103" class="lbl-sm">Softmax</text>

  <rect x="798" y="70" width="70" height="50" rx="4" class="io"/>
  <text x="833" y="93" class="lbl-sm">Next-</text>
  <text x="833" y="103" class="lbl-sm">token</text>

  <line x1="90" y1="95" x2="102" y2="95" class="arr"/>
  <line x1="174" y1="95" x2="186" y2="95" class="arr"/>
  <line x1="258" y1="95" x2="270" y2="95" class="arr"/>
  <line x1="342" y1="95" x2="354" y2="95" class="arr"/>
  <line x1="510" y1="95" x2="522" y2="95" class="arr"/>

  <!-- ×N bracket, surrounding the repeated block and the residual arcs above it -->
  <rect x="346" y="18" width="274" height="112" rx="10" fill="none" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="4 3"/>
  <circle cx="346" cy="18" r="10" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="346" y="21" class="lbl-sm" font-weight="600">&#215;N</text>

  <!-- residual 1: branches off the incoming arrow before Self-Attn (the
       true residual input), around Self-Attn, into the "+" before Norm -->
  <circle cx="348" cy="95" r="2.2" fill="#166534"/>
  <path d="M 348 95 C 348 30, 433 30, 433 87" class="res-arr"/>
  <line x1="426" y1="95" x2="431" y2="95" class="arr"/>
  <circle cx="433" cy="95" r="8" class="sum"/>
  <text x="433" y="98" class="lbl-sm" fill="#166534" font-weight="600">+</text>

  <!-- residual 2: branches off the incoming arrow before Feed-Forward,
       around Feed-Forward, into the "+" — no norm follows -->
  <circle cx="516" cy="95" r="2.2" fill="#166534"/>
  <path d="M 516 95 C 516 30, 601 30, 601 87" class="res-arr"/>
  <line x1="594" y1="95" x2="599" y2="95" class="arr"/>
  <circle cx="601" cy="95" r="8" class="sum"/>
  <text x="601" y="98" class="lbl-sm" fill="#166534" font-weight="600">+</text>
  <line x1="609" y1="95" x2="628" y2="95" class="arr"/>

  <line x1="700" y1="95" x2="712" y2="95" class="arr"/>
  <line x1="784" y1="95" x2="796" y2="95" class="arr"/>

  <!-- highlight: self-attention -->
  <ellipse cx="391" cy="95" rx="48" ry="38" class="hl"/>

  <text x="455" y="175" class="cap">Highlighted: masked self-attention, with its residual</text>
  <text x="455" y="188" class="cap">connection — the first block in each layer.</text>
</svg>
