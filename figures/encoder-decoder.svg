<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <style>
    .block { fill: #eef2ff; stroke: #3730a3; stroke-width: 1.5; }
    .addnorm { fill: #fef9c3; stroke: #92400e; stroke-width: 1.2; }
    .io { fill: #f3f4f6; stroke: #374151; stroke-width: 1.2; }
    .stacklabel { fill: #ffffff; stroke: #111827; stroke-width: 1.5; }
    .lbl { font-size: 13px; fill: #111827; text-anchor: middle; }
    .lbl-sm { font-size: 11px; fill: #111827; text-anchor: middle; }
    .cap { font-size: 12px; fill: #374151; text-anchor: middle; }
    .arr { stroke: #1f2937; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  </style>

  <!-- Title -->
  <text x="410" y="24" class="lbl" font-size="16" font-weight="600">The original Transformer: two stacks</text>

  <!-- Column headings -->
  <text x="180" y="52" class="lbl" font-weight="600">Encoder</text>
  <text x="630" y="52" class="lbl" font-weight="600">Decoder</text>

  <!-- ENCODER STACK (left) -->
  <rect x="70" y="450" width="220" height="34" rx="4" class="io"/>
  <text x="180" y="471" class="lbl-sm">Input tokens + position</text>

  <line x1="180" y1="450" x2="180" y2="420" class="arr"/>
  <rect x="70" y="370" width="220" height="50" rx="4" class="block"/>
  <text x="180" y="391" class="lbl-sm">Self-Attention</text>
  <text x="180" y="408" class="lbl-sm">(every input token attends to every other)</text>

  <line x1="180" y1="370" x2="180" y2="350" class="arr"/>
  <rect x="100" y="328" width="160" height="22" rx="3" class="addnorm"/>
  <text x="180" y="343" class="lbl-sm">Add &amp; Norm</text>

  <line x1="180" y1="328" x2="180" y2="304" class="arr"/>
  <rect x="70" y="260" width="220" height="44" rx="4" class="block"/>
  <text x="180" y="286" class="lbl-sm">Feed-Forward</text>

  <line x1="180" y1="260" x2="180" y2="240" class="arr"/>
  <rect x="100" y="218" width="160" height="22" rx="3" class="addnorm"/>
  <text x="180" y="233" class="lbl-sm">Add &amp; Norm</text>

  <!-- N x bracket for encoder -->
  <rect x="46" y="212" width="270" height="214" rx="8" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="46" cy="212" r="14" class="stacklabel"/>
  <text x="46" y="217" class="lbl-sm" font-weight="600">&#215;N</text>

  <line x1="180" y1="212" x2="180" y2="190" class="arr"/>
  <rect x="70" y="158" width="220" height="30" rx="4" class="io"/>
  <text x="180" y="178" class="lbl-sm">Encoded representation</text>

  <!-- DECODER STACK (right) -->
  <rect x="520" y="520" width="220" height="34" rx="4" class="io"/>
  <text x="630" y="541" class="lbl-sm">Output tokens so far + position</text>

  <line x1="630" y1="520" x2="630" y2="492" class="arr"/>
  <rect x="520" y="444" width="220" height="46" rx="4" class="block"/>
  <text x="630" y="464" class="lbl-sm">Masked Self-Attention</text>
  <text x="630" y="480" class="lbl-sm">(attends only to earlier outputs)</text>

  <line x1="630" y1="444" x2="630" y2="424" class="arr"/>
  <rect x="550" y="402" width="160" height="22" rx="3" class="addnorm"/>
  <text x="630" y="417" class="lbl-sm">Add &amp; Norm</text>

  <line x1="630" y1="402" x2="630" y2="376" class="arr"/>
  <rect x="520" y="332" width="220" height="44" rx="4" class="block"/>
  <text x="630" y="352" class="lbl-sm">Cross-Attention</text>
  <text x="630" y="368" class="lbl-sm">(attends to the encoder output)</text>

  <!-- encoder -> decoder cross-attention arrow -->
  <path d="M 292 173 C 420 173, 420 354, 518 354" class="arr" fill="none"/>

  <line x1="630" y1="332" x2="630" y2="312" class="arr"/>
  <rect x="550" y="290" width="160" height="22" rx="3" class="addnorm"/>
  <text x="630" y="305" class="lbl-sm">Add &amp; Norm</text>

  <line x1="630" y1="290" x2="630" y2="266" class="arr"/>
  <rect x="520" y="222" width="220" height="44" rx="4" class="block"/>
  <text x="630" y="248" class="lbl-sm">Feed-Forward</text>

  <line x1="630" y1="222" x2="630" y2="202" class="arr"/>
  <rect x="550" y="180" width="160" height="22" rx="3" class="addnorm"/>
  <text x="630" y="195" class="lbl-sm">Add &amp; Norm</text>

  <!-- N x bracket for decoder -->
  <rect x="496" y="174" width="270" height="326" rx="8" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="496" cy="174" r="14" class="stacklabel"/>
  <text x="496" y="179" class="lbl-sm" font-weight="600">&#215;N</text>

  <line x1="630" y1="174" x2="630" y2="150" class="arr"/>
  <rect x="550" y="118" width="160" height="30" rx="4" class="io"/>
  <text x="630" y="138" class="lbl-sm">Linear + Softmax</text>

  <line x1="630" y1="118" x2="630" y2="96" class="arr"/>
  <text x="630" y="84" class="lbl-sm" font-weight="600">Next-token probabilities</text>

  <text x="410" y="584" class="cap">Adapted from Vaswani et al. (2017), &#8220;Attention Is All You Need,&#8221; Figure 1.</text>
</svg>
